[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "agent-claimcheck"
version = "0.1.1"
description = "Check AI agent success claims against trace evidence instead of trusting the final message."
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Andrii Boiko", email = "142843700+B0yko@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["ai-agents", "agent-evaluation", "llm-evaluation", "llm-as-a-judge", "calibration", "evals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer",
    "rich",
    "pydantic>=2",
    "jsonschema",
    "httpx",
    "pyyaml",
    "numpy",
    "scikit-learn",
    "tzdata",
]

[project.urls]
Homepage = "https://github.com/B0yko/agent-claimcheck"
Repository = "https://github.com/B0yko/agent-claimcheck"
Changelog = "https://github.com/B0yko/agent-claimcheck/blob/main/CHANGELOG.md"
Issues = "https://github.com/B0yko/agent-claimcheck/issues"

[project.scripts]
agent-claimcheck = "agent_claimcheck.cli:main"

# PyPI renders the README without the repository around it, so relative links
# are rewritten to the tagged sources on GitHub (images to raw files).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/B0yko/agent-claimcheck/v0.1.1/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/B0yko/agent-claimcheck/v0.1.1/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/B0yko/agent-claimcheck/blob/v0.1.1/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/B0yko/agent-claimcheck/blob/v0.1.1/\1)'

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_claimcheck"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/agent-trace-v1.json" = "agent_claimcheck/schemas/agent-trace-v1.json"
"schemas/claimcheck-result-v1.json" = "agent_claimcheck/schemas/claimcheck-result-v1.json"
"examples" = "agent_claimcheck/_data/examples"
"benchmark/v1" = "agent_claimcheck/_data/benchmark/v1"
"results/v0.1.0" = "agent_claimcheck/_data/results/v0.1.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
