name: Publish to PyPI

# Manual only: this workflow never runs on push, pull_request, schedule or
# any other automatic trigger, and it refuses to do anything unless it is
# run against a v* tag. Publishing is a deliberate, human-triggered action.
on:
  workflow_dispatch: {}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
