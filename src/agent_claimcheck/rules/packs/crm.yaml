pack: crm
version: 1
tools: ["crm.*"]
claim_patterns:
  updated: ['\bupdat(e|ed|ing)\b']
  note_added: ['\bnote\b.*\badded\b', '\badded\b.*\bnote\b']
  stage_changed:
    - '\b(chang|mov|advanc)\w*\b.*\b(stage|deal)\b.*\bto\b'
    - '\b(stage|deal)\b.*\b(chang|mov|advanc)\w*\b.*\bto\b'
claims:
  updated:
    action: "crm.update_contact"
    receipt:
      record_id: { equals: "{subject.record_id}", as: string }
      updated_fields: { exists: true }
    probe: "crm.read_record"
    probe_checks:
      fields: { subset: "{subject.fields}" }
  note_added:
    action: "crm.add_note"
    receipt:
      note_id: { exists: true }
    probe: "crm.read_record"
    probe_checks:
      notes: { exists: true }
  stage_changed:
    action: "crm.update_deal_stage"
    receipt:
      stage: { equals: "{subject.stage}" }
    probe: "crm.read_record"
    probe_checks:
      stage: { equals: "{subject.stage}" }
